name: 楽天ROOM自動投稿

on:
  schedule:
    # 毎日13回投稿 - JST（UTC+9）での時間指定
    # 08:00 JST = 23:00 UTC (前日)
    - cron: '0 23 * * *'
    # 09:00 JST = 00:00 UTC
    - cron: '0 0 * * *'
    # 10:00 JST = 01:00 UTC
    - cron: '0 1 * * *'
    # 11:00 JST = 02:00 UTC
    - cron: '0 2 * * *'
    # 12:00 JST = 03:00 UTC
    - cron: '0 3 * * *'
    # 13:00 JST = 04:00 UTC
    - cron: '0 4 * * *'
    # 14:00 JST = 05:00 UTC
    - cron: '0 5 * * *'
    # 15:00 JST = 06:00 UTC
    - cron: '0 6 * * *'
    # 16:00 JST = 07:00 UTC
    - cron: '0 7 * * *'
    # 17:00 JST = 08:00 UTC
    - cron: '0 8 * * *'
    # 18:00 JST = 09:00 UTC
    - cron: '0 9 * * *'
    # 19:00 JST = 10:00 UTC
    - cron: '0 10 * * *'
    # 20:00 JST = 11:00 UTC
    - cron: '0 11 * * *'
    # 21:00 JST = 12:00 UTC
    - cron: '0 12 * * *'
    # 22:00 JST = 13:00 UTC
    - cron: '0 13 * * *'
    # 23:00 JST = 14:00 UTC
    - cron: '0 14 * * *'
    # 23:30 JST = 14:30 UTC
    - cron: '30 14 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 依存関係をインストール
        run: npm install

      - name: 楽天ROOM自動投稿を実行
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_EMAIL: ${{ secrets.RAKUTEN_EMAIL }}
          RAKUTEN_PASSWORD: ${{ secrets.RAKUTEN_PASSWORD }}
        run: npm start -- --once

      - name: ログをアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
