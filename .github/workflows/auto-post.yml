name: 楽天ROOM自動投稿

on:
  schedule:
    # 毎日13回投稿 - JST（UTC+9）
    # 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00, 22:00 JST
    - cron: '0 23,1,3,5,7,9,11,13 * * *'  # 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00, 22:00 JST
    # 09:00, 11:00, 13:00, 15:00, 17:00, 19:00, 21:00 JST
    - cron: '0 0,2,4,6,8,10,12 * * *'     # 09:00, 11:00, 13:00, 15:00, 17:00, 19:00, 21:00 JST
    # 23:30 JST
    - cron: '30 14 * * *'                 # 23:30 JST
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 依存関係をインストール
        run: npm install

      - name: 楽天ROOM自動投稿を実行
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_EMAIL: ${{ secrets.RAKUTEN_EMAIL }}
          RAKUTEN_PASSWORD: ${{ secrets.RAKUTEN_PASSWORD }}
        run: npm start -- --once

      - name: ログをアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
